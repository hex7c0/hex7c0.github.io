<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Francesco Carnielli · hex7c0</title>
  <meta name="author" content="hex7c0" />
  <meta name="description" content="Personal index page for Francesco Carnielli AKA hex7c0." />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <meta property="og:title" content="Francesco Carnielli · hex7c0" />
  <meta property="og:description" content="Personal index page for Francesco Carnielli AKA hex7c0." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://hex7c0.github.io/" />
  <meta name="theme-color" content="#020617" />

  <style>
    :root {
      --bg: #020617;
      --bg-soft: #0b1120;
      --fg: #e5e7eb;
      --muted: #9ca3af;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.18);
      --link-hover: #7dd3fc;
      --font-sans: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Fira Code", "JetBrains Mono", monospace;
      --radius-lg: 0.75rem;
      --radius-full: 999px;
      --shadow-soft: 0 18px 45px rgba(15, 23, 42, 0.75);
      --transition-fast: 160ms ease-out;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    /* Skip link: visible on keyboard focus */
    .skip-link {
      position: absolute;
      left: -9999px;
      top: auto;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    .skip-link:focus {
      left: 1rem;
      top: 1rem;
      width: auto;
      height: auto;
      padding: 0.4rem 0.75rem;
      background: rgba(255,255,255,0.06);
      border-radius: 6px;
      z-index: 9999;
      color: var(--fg);
      text-decoration: none;
      outline: 2px solid var(--accent);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-sans);
      background:
        radial-gradient(circle at 10% 0%, #1e293b 0, transparent 55%),
        radial-gradient(circle at 90% 0%, #0f766e 0, transparent 55%),
        radial-gradient(circle at 50% 100%, #1f2937 0, transparent 55%),
        linear-gradient(180deg, var(--bg-soft), var(--bg));
      color: var(--fg);
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    main.page {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem 2rem;
      text-align: center;
      position: relative;
      z-index: 1;
      gap: 2.5rem;
    }

    .hero {
      max-width: 640px;
    }

    .hero h1 {
      margin: 0 0 0.25rem;
      font-size: clamp(2.2rem, 3vw + 1rem, 3.1rem);
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .hero h2 {
      margin: 0;
      font-size: clamp(1.1rem, 1.2vw + 0.9rem, 1.5rem);
      font-weight: 300;
      opacity: 0.9;
    }

    .hero .aka {
      opacity: 0.7;
      font-size: 0.9em;
      margin: 0 0.4rem;
    }

    .hero code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New",
        monospace;
      padding: 0.12rem 0.45rem;
      border-radius: var(--radius-full);
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.45);
      font-size: 0.95em;
    }

    nav.links {
      padding: 1.1rem 1.25rem;
      border-radius: 999px;
      background: linear-gradient(
          135deg,
          rgba(15, 23, 42, 0.9),
          rgba(15, 23, 42, 0.95)
        );
      border: 1px solid rgba(148, 163, 184, 0.45);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    nav.links ul {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      justify-content: center;
      align-items: center;
    }

    nav.links li {
      margin: 0;
      padding: 0;
      transition: opacity var(--transition-fast);
    }

    nav.links a {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      border: 1px solid transparent;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--fg);
      opacity: 0.9;
      background: radial-gradient(circle at 0 0, var(--accent-soft), transparent 55%);
      cursor: pointer;
      white-space: nowrap;
      transition:
        background var(--transition-fast),
        border-color var(--transition-fast),
        color var(--transition-fast),
        opacity var(--transition-fast),
        transform var(--transition-fast),
        box-shadow var(--transition-fast);
    }

    nav.links a::after {
      content: "";
      position: absolute;
      inset: 0.2rem;
      border-radius: inherit;
      border: 1px solid rgba(148, 163, 184, 0.35);
      opacity: 0;
      transition: opacity var(--transition-fast);
    }

    nav.links a:hover,
    nav.links a:focus-visible {
      outline: none;
      background: radial-gradient(circle at 10% 0%, rgba(56, 189, 248, 0.35), transparent 65%);
      border-color: var(--accent);
      color: var(--link-hover);
      opacity: 1;
      transform: translateY(-1px);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.85);
    }

    nav.links a:hover::after,
    nav.links a:focus-visible::after {
      opacity: 0.45;
    }

    nav.links li.fade {
      opacity: 0.25;
    }

    .avatar {
      margin: 0;
      padding: 0.65rem;
      border-radius: var(--radius-lg);
      background: radial-gradient(circle at 20% 0%, rgba(56, 189, 248, 0.24), transparent 55%);
      border: 1px solid rgba(30, 64, 175, 0.9);
      box-shadow: var(--shadow-soft);
    }

    .avatar img {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: calc(var(--radius-lg) - 0.35rem);
      opacity: 0.96;
      transform-origin: center center;
      transition:
        transform var(--transition-fast),
        box-shadow var(--transition-fast),
        opacity var(--transition-fast);
      will-change: transform, box-shadow;
    }

    .avatar img:hover {
      opacity: 1;
      box-shadow: 0 22px 50px rgba(15, 23, 42, 0.95);
    }

    footer.site-footer {
      position: relative;
      z-index: 1;
      padding: 0.8rem 1.5rem 1.4rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .noscript-hint {
      display: block;
      margin-top: 0.4rem;
      font-style: italic;
      letter-spacing: 0.04em;
    }

    .game-line {
      position: fixed;
      pointer-events: none;
      z-index: 0;
    }

    #upper {
      top: 0;
      left: 0;
      width: 0;
      height: 100vh;
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
    }

    #lateral {
      top: 0;
      left: 0;
      width: 100vw;
      height: 0;
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
    }

    .game-line__bar {
      background: linear-gradient(to bottom, rgba(56, 189, 248, 0.85), transparent);
      width: 2px;
      height: 0;
      box-shadow: 0 0 22px rgba(56, 189, 248, 0.68);
    }

    #lateral-bar {
      background: linear-gradient(to right, rgba(56, 189, 248, 0.85), transparent);
      width: 0;
      height: 2px;
    }

    /* prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      .avatar img {
        transition: opacity 120ms ease-out;
        transform: none !important;
        box-shadow: var(--shadow-soft) !important;
      }

      #upper,
      #lateral {
        display: none;
      }
    }

    /* Mobile: 2x2 */
    @media (max-width: 640px) {
      main.page {
        padding-top: 3.5rem;
      }

      nav.links {
        border-radius: 1.2rem;
        padding: 0.9rem;
        width: 100%;
        max-width: 360px;
      }

      nav.links ul {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.6rem;
      }

      nav.links li {
        width: 100%;
      }

      nav.links a {
        width: 100%;
        justify-content: center;
        font-size: 0.8rem;
        padding: 0.4rem 0.75rem;
      }

      .avatar {
        max-width: 180px;
      }
    }
  </style>
</head>
<body>
  <!-- game crosshair overlays -->
  <div class="game-line" id="upper">
    <div class="game-line__bar" id="upper-bar"></div>
  </div>
  <div class="game-line" id="lateral">
    <div class="game-line__bar" id="lateral-bar"></div>
  </div>

  <main id="main" class="page">
    <header class="hero">
      <h1>Welcome</h1>
      <h2>
        Francesco Carnielli
        <span class="aka">AKA</span>
        <code>hex7c0</code>
      </h2>
    </header>

    <nav class="links" id="nav" aria-label="Primary links">
      <ul>
        <li>
          <a href="https://github.com/hex7c0" target="_blank" rel="me noopener noreferrer">
            GitHub
          </a>
        </li>
        <li>
          <a href="https://gitlab.com/hex7c0" target="_blank" rel="me noopener noreferrer">
            GitLab
          </a>
        </li>
        <li>
          <a href="https://www.linkedin.com/in/francesco-carnielli/" target="_blank" rel="noopener noreferrer">
            LinkedIn
          </a>
        </li>
        <li>
          <a href="mailto:francesco@carnielli.dev" rel="noopener noreferrer">
            Email
          </a>
        </li>
      </ul>
    </nav>

    <figure class="avatar" aria-hidden="false">
      <img
        id="stan"
        src="stan.gif"
        alt="Animated avatar of Francesco Carnielli"
        width="95"
        height="128"
        loading="lazy"
        decoding="async"
      />
    </figure>
  </main>

  <footer class="site-footer">
    <noscript>
      <span class="noscript-hint">JavaScript is disabled, the interaction layer is unavailable.</span>
    </noscript>
  </footer>

  <script>
    (() => {
      "use strict";

      const stan = document.getElementById("stan");
      const nav = document.getElementById("nav");
      const upper = document.getElementById("upper");
      const upperBar = document.getElementById("upper-bar");
      const lateral = document.getElementById("lateral");
      const lateralBar = document.getElementById("lateral-bar");
      const linkItems = Array.from(nav.querySelectorAll("li"));

      let middleX = window.innerWidth / 2;
      let middleY = window.innerHeight / 2;

      function updateMiddle() {
        middleX = window.innerWidth / 2;
        middleY = window.innerHeight / 2;
      }

      window.addEventListener("resize", updateMiddle);

      const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const isCoarsePointer = window.matchMedia("(pointer: coarse)").matches;
      const hasHover = window.matchMedia("(hover: hover)").matches;

      // desktop Only
      const enableMotion = !prefersReducedMotion && hasHover && !isCoarsePointer;

      if (enableMotion) {
        let lastMouseEvent = null;
        let frameRequested = false;

        function handleMouseFrame() {
          frameRequested = false;
          if (!lastMouseEvent) return;

          const x = lastMouseEvent.clientX;
          const y = lastMouseEvent.clientY;

          // crosshair lines
          upper.style.left = `${String(x)}px`;
          upperBar.style.height = `${String(y)}px`;

          lateral.style.top = `${String(y)}px`;
          lateralBar.style.width = `${String(x)}px`;

          // avatar parallax/tilt
          const dx = x - middleX;
          const dy = middleY - y;

          const rotateY = dx / 16;
          const rotateX = dy / 12;
          const scaleX = dx < 0 ? -1 : 1;

          const shadowOffset = (rotateX - rotateY) / 8;

          stan.style.transform =
            "rotateY(" + rotateY + "deg) rotateX(" + rotateX + "deg) scaleX(" + scaleX + ")";
          stan.style.boxShadow =
            shadowOffset + "px " + shadowOffset + "px 22px rgba(15, 23, 42, 0.95)";
        }

        window.addEventListener(
          "mousemove",
          function (event) {
            lastMouseEvent = event;
            if (!frameRequested) {
              frameRequested = true;
              window.requestAnimationFrame(handleMouseFrame);
            }
          },
          { passive: true }
        );

        // link hover fading
        linkItems.forEach(function (item) {
          item.addEventListener("mouseenter", function () {
            linkItems.forEach(function (li) {
              li.classList.add("fade");
            });
            item.classList.remove("fade");
          });

          item.addEventListener("mouseleave", function () {
            linkItems.forEach(function (li) {
              li.classList.remove("fade");
            });
          });
        });
      } else {
        // mobile
        upper.style.display = "none";
        lateral.style.display = "none";
      }
    })();
  </script>
</body>
</html>
